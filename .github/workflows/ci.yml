name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: cargo test + wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Clean rustup with the wasm32 target — no Homebrew-rust PATH shadow here
      # (that trap is macOS-local; ubuntu runners only have rustup).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests (native) — the FAF tool dispatch
        run: cargo test --lib

      - name: Install worker-build
        # Pinned: worker-build passes --force-enable-abort-handler, which only
        # exists from wasm-bindgen 0.2.128. Unpinned, a new worker-build lands
        # against whatever wasm-bindgen Cargo.lock holds and the WASM build dies.
        run: cargo install worker-build --version 0.8.6 --locked

      - name: WASM build (proves it compiles for Cloudflare Workers)
        run: worker-build --release

  deploy:
    name: deploy to Cloudflare
    runs-on: ubuntu-latest
    # Only on a real push to main, and only once the wasm build above passed —
    # a Worker that fails `cargo test` should never reach the edge.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # Cloudflare Workers Builds cannot do this: its image ships Node, Python,
      # Ruby and Go, with no Rust at all (proven 2026-09-23, build 3a75d9ef —
      # `/bin/sh: 1: cargo: not found`). A real toolchain is why deploy lives here.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install worker-build
        # Pinned: worker-build passes --force-enable-abort-handler, which only
        # exists from wasm-bindgen 0.2.128. Unpinned, a new worker-build lands
        # against whatever wasm-bindgen Cargo.lock holds and the WASM build dies.
        run: cargo install worker-build --version 0.8.6 --locked

      # wrangler runs `[build] command = "worker-build --release"` from
      # wrangler.toml itself, so no explicit build step is needed here.
      # Not cloudflare/wrangler-action@v3: it installs wrangler 3.90.0, which
      # returns "Authentication error [code: 10000]" for a token that deploys
      # fine by hand, and warns in its own logs that it is out-of-date. This is
      # verbatim the command proven to work locally, on a pinned wrangler 4.
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4.139.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Confirm what is live
        run: npx --yes wrangler@4.139.0 deployments list | tail -20
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
