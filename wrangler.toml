name = "rust-faf-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2026-01-01"

# Rust → WASM build via worker-build (workers-rs). Produces build/worker/shim.mjs
# + the wasm module. Deploy with `wrangler deploy`.
[build]
# Cloudflare Workers Builds CANNOT build this Worker: its image ships Node,
# Python, Ruby and Go — no Rust, no cargo. Proven 2026-09-23, build 3a75d9ef:
# `/bin/sh: 1: cargo: not found`. Do not try to fix it with a build command;
# there is no toolchain to install into. Deploy from a machine with Rust, or
# via GitHub Actions with dtolnay/rust-toolchain. See CF-DEPLOY notes.
command = "worker-build --release"
